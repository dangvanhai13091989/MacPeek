<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">How MacPeek works</title>
  <desc id="desc">Hover a Dock icon, preview open windows, then click a thumbnail to switch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15172a"/><stop offset="1" stop-color="#0c0e18"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#5fe1ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#777d9e"/></marker>
  </defs>
  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <g transform="translate(70 54)">
      <rect width="350" height="250" rx="24" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="48" cy="48" r="24" fill="url(#accent)"/><text x="40" y="56" fill="#fff" font-size="23" font-weight="700">1</text>
      <text x="32" y="112" fill="#fff" font-size="26" font-weight="700">Hover a Dock icon</text>
      <rect x="32" y="150" width="286" height="65" rx="20" fill="#fff" fill-opacity=".12"/>
      <rect x="61" y="160" width="45" height="45" rx="12" fill="#3da8ff"/>
      <rect x="123" y="156" width="53" height="53" rx="14" fill="url(#accent)" stroke="#fff" stroke-width="3"/>
      <rect x="193" y="160" width="45" height="45" rx="12" fill="#20c97a"/>
      <rect x="255" y="160" width="45" height="45" rx="12" fill="#ffbe3f"/>
      <path d="M151 230l12 24-13-5-8 14-7-4 8-14-12-7Z" fill="#fff"/>
    </g>
    <path d="M445 180H505" stroke="#777d9e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(525 54)">
      <rect width="350" height="250" rx="24" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="48" cy="48" r="24" fill="url(#accent)"/><text x="40" y="56" fill="#fff" font-size="23" font-weight="700">2</text>
      <text x="32" y="112" fill="#fff" font-size="26" font-weight="700">Preview every window</text>
      <g transform="translate(32 142)">
        <rect width="133" height="76" rx="11" fill="#50566f"/><rect x="13" y="14" width="80" height="8" rx="4" fill="#fff" opacity=".65"/><rect x="13" y="34" width="104" height="6" rx="3" fill="#fff" opacity=".2"/>
        <rect x="151" width="133" height="76" rx="11" fill="#444b64"/><circle cx="185" cy="31" r="15" fill="#8b7cff"/><rect x="209" y="20" width="57" height="7" rx="3" fill="#fff" opacity=".4"/>
      </g>
    </g>
    <path d="M900 180H960" stroke="#777d9e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(980 54)">
      <rect width="350" height="250" rx="24" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="48" cy="48" r="24" fill="url(#accent)"/><text x="40" y="56" fill="#fff" font-size="23" font-weight="700">3</text>
      <text x="32" y="112" fill="#fff" font-size="26" font-weight="700">Click to switch</text>
      <rect x="32" y="144" width="286" height="78" rx="15" fill="#4a506b" stroke="#8b7cff" stroke-width="3"/>
      <circle cx="73" cy="183" r="21" fill="url(#accent)"/>
      <rect x="108" y="166" width="167" height="11" rx="5" fill="#fff" opacity=".65"/>
      <rect x="108" y="190" width="126" height="8" rx="4" fill="#fff" opacity=".22"/>
      <path d="M279 211l12 24-13-5-8 14-7-4 8-14-12-7Z" fill="#fff"/>
    </g>
  </g>
</svg>
