<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">MacPeek Dock window preview</title>
  <desc id="desc">A product illustration showing live window thumbnails above the macOS Dock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111426"/>
      <stop offset="0.55" stop-color="#191733"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#5fe1ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34364a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#202231" stop-opacity=".96"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="54"/>
    </filter>
  </defs>

  <rect width="1400" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="1120" cy="130" r="245" fill="#6c5ce7" opacity=".22" filter="url(#glow)"/>
  <circle cx="240" cy="650" r="250" fill="#35c7ff" opacity=".12" filter="url(#glow)"/>

  <g transform="translate(72 64)">
    <circle cx="42" cy="42" r="42" fill="url(#accent)"/>
    <path d="M18 43c12-22 36-22 48 0-12 22-36 22-48 0Z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="42" cy="43" r="9" fill="#fff"/>
    <text x="106" y="45" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="46" font-weight="750">MacPeek</text>
    <text x="106" y="75" fill="#a8acc4" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20">Dock window previews for macOS</text>
  </g>

  <g transform="translate(72 178)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect width="285" height="46" rx="23" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".11"/>
    <circle cx="25" cy="23" r="6" fill="#6fffb0"/>
    <text x="43" y="30" fill="#e7e9f5" font-size="18" font-weight="600">Free and open source</text>
    <rect x="302" width="242" height="46" rx="23" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".11"/>
    <text x="326" y="30" fill="#e7e9f5" font-size="18" font-weight="600">Apple notarized</text>
    <rect x="561" width="263" height="46" rx="23" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".11"/>
    <text x="585" y="30" fill="#e7e9f5" font-size="18" font-weight="600">Automatic updates</text>
  </g>

  <g transform="translate(155 272)" filter="url(#shadow)">
    <rect width="1090" height="392" rx="28" fill="#171927" stroke="#ffffff" stroke-opacity=".15"/>
    <rect width="1090" height="48" rx="28" fill="#242638"/>
    <rect y="25" width="1090" height="23" fill="#242638"/>
    <circle cx="28" cy="24" r="7" fill="#ff655c"/>
    <circle cx="52" cy="24" r="7" fill="#ffbe3f"/>
    <circle cx="76" cy="24" r="7" fill="#30c94a"/>

    <rect x="32" y="78" width="640" height="222" rx="18" fill="#222638"/>
    <rect x="58" y="105" width="262" height="17" rx="8" fill="#8b7cff" opacity=".85"/>
    <rect x="58" y="140" width="410" height="12" rx="6" fill="#ffffff" opacity=".22"/>
    <rect x="58" y="166" width="360" height="12" rx="6" fill="#ffffff" opacity=".14"/>
    <rect x="58" y="212" width="180" height="58" rx="14" fill="url(#accent)" opacity=".82"/>
    <rect x="252" y="212" width="180" height="58" rx="14" fill="#ffffff" opacity=".08"/>

    <g transform="translate(622 24)">
      <rect width="414" height="270" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".22"/>
      <text x="24" y="39" fill="#f3f4ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="650">Chrome — 3 windows</text>
      <g transform="translate(22 61)">
        <rect width="176" height="83" rx="11" fill="#555a76"/>
        <rect x="13" y="13" width="104" height="9" rx="4" fill="#ffffff" opacity=".7"/>
        <rect x="13" y="32" width="142" height="7" rx="3" fill="#ffffff" opacity=".24"/>
        <rect x="13" y="49" width="126" height="7" rx="3" fill="#ffffff" opacity=".16"/>
        <rect x="192" width="176" height="83" rx="11" fill="#4c526d"/>
        <circle cx="226" cy="30" r="16" fill="#6c5ce7"/>
        <rect x="252" y="20" width="94" height="8" rx="4" fill="#ffffff" opacity=".55"/>
        <rect x="252" y="39" width="72" height="7" rx="3" fill="#ffffff" opacity=".18"/>
        <rect y="100" width="176" height="83" rx="11" fill="#424961"/>
        <rect x="13" y="113" width="150" height="13" rx="6" fill="#5fe1ff" opacity=".55"/>
        <rect x="13" y="140" width="108" height="7" rx="3" fill="#ffffff" opacity=".22"/>
        <rect x="13" y="158" width="138" height="7" rx="3" fill="#ffffff" opacity=".14"/>
      </g>
    </g>

    <g transform="translate(300 324)">
      <rect width="490" height="72" rx="24" fill="#ffffff" fill-opacity=".13" stroke="#ffffff" stroke-opacity=".2"/>
      <g transform="translate(28 12)">
        <rect width="48" height="48" rx="12" fill="#3da8ff"/>
        <text x="13" y="34" font-size="29">⌘</text>
        <rect x="70" width="48" height="48" rx="12" fill="url(#accent)"/>
        <path d="M82 25c6-11 18-11 24 0-6 11-18 11-24 0Z" fill="none" stroke="#fff" stroke-width="3"/><circle cx="94" cy="25" r="4" fill="#fff"/>
        <rect x="140" width="48" height="48" rx="12" fill="#ff5f57"/>
        <rect x="210" width="48" height="48" rx="12" fill="#5b5d72"/>
        <rect x="280" width="48" height="48" rx="12" fill="#20c97a"/>
        <rect x="350" width="48" height="48" rx="12" fill="#ffbe3f"/>
        <rect x="420" width="48" height="48" rx="12" fill="#5b5d72"/>
      </g>
    </g>
  </g>
</svg>
