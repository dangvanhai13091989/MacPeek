name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: >-
          xcodebuild
          -project MacPeek.xcodeproj
          -scheme MacPeek
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
